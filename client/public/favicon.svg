<svg viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Accent Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Vinyl Record Base -->
  <circle cx="256" cy="256" r="160" fill="#090d16" stroke="#1e293b" stroke-width="6" />
  <circle cx="256" cy="256" r="135" fill="none" stroke="#1e293b" stroke-width="2" opacity="0.8" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#1e293b" stroke-width="2" opacity="0.8" />
  <circle cx="256" cy="256" r="85" fill="none" stroke="#1e293b" stroke-width="2" opacity="0.8" />

  <!-- Dynamic Equalizer Waves (JMS Center Peak) -->
  <g filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="180" y="220" width="16" height="72" rx="8" fill="url(#blueGrad)" />
    <!-- Bar 2 -->
    <rect x="210" y="180" width="16" height="152" rx="8" fill="url(#blueGrad)" />
    <!-- Bar 3 (Center High) -->
    <rect x="240" y="140" width="16" height="232" rx="8" fill="url(#blueGrad)" />
    <!-- Bar 4 -->
    <rect x="270" y="170" width="16" height="172" rx="8" fill="url(#blueGrad)" />
    <!-- Bar 5 -->
    <rect x="300" y="210" width="16" height="92" rx="8" fill="url(#blueGrad)" />
  </g>

  <!-- Center Vinyl Hole Accent -->
  <circle cx="256" cy="256" r="20" fill="#0f172a" stroke="#ffffff" stroke-width="3" opacity="0.9" />
</svg>